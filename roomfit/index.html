<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roomfit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a drafting desk. Controls on the left, the to-scale plan pinned on the right. */
:root {
  --bg: #f1f4f3; --surface: #ffffff; --ink: #15272a; --muted: #5a6c6e; --line: #d2dbd9;
  --accent: #0d6a69; --accent-ink: #ffffff; --soft: #e3eeec;
  --warn: #a9530f; --warn-bg: #fbeedd; --bad: #ab231c; --bad-bg: #fbe6e3; --ok: #23744a; --ok-bg: #e2f2e8;
  --paper: #fbfbf8; --plan-ink: #1c2b2d;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1617; --surface: #162123; --ink: #e5eded; --muted: #93a5a7; --line: #2a3b3d;
  --accent: #5bc4bd; --accent-ink: #062524; --soft: #1d3233;
  --warn: #f0b072; --warn-bg: #3a2a17; --bad: #f29a92; --bad-bg: #3d1f1c; --ok: #7fd3a4; --ok-bg: #173324;
  --paper: #e9ece8; --plan-ink: #1c2b2d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1617; --surface: #162123; --ink: #e5eded; --muted: #93a5a7; --line: #2a3b3d;
  --accent: #5bc4bd; --accent-ink: #062524; --soft: #1d3233;
  --warn: #f0b072; --warn-bg: #3a2a17; --bad: #f29a92; --bad-bg: #3d1f1c; --ok: #7fd3a4; --ok-bg: #173324;
  --paper: #e9ece8; --plan-ink: #1c2b2d; color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.shell { max-width: 1240px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 24px; letter-spacing: -0.01em; }
h2 { font-size: 18px; }
h3 { font-size: 12px; font-family: var(--body); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand span { color: var(--muted); font-size: 13px; }
.rooms { display: flex; gap: 8px; align-items: center; }
.steps { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.steps button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font: 500 14px var(--body);
  color: var(--muted); cursor: pointer; white-space: nowrap; }
.steps button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.steps .n { font-family: var(--mono); font-size: 12px; margin-right: 6px; color: var(--accent); }

.wrap { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; margin-top: 20px; align-items: start; }
.wrap.wide { grid-template-columns: minmax(0, 1fr); max-width: 900px; }
.wrap.wide .stage { display: none; }
.panel { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.group { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > label { flex: 1 1 96px; min-width: 0; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; }
input, select, button { font: inherit; color: inherit; }
input[type="number"], input[type="text"], select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); }
input[type="number"] { font-family: var(--mono); }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; }
.btn.x { padding: 7px 9px; color: var(--muted); align-self: flex-end; }
.opening { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.opening label { flex: 1 1 78px; min-width: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; }
.swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.swatch i { display: flex; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.swatch i b { width: 14px; height: 20px; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--soft); font-size: 13px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
.thumbs img { width: 72px; height: 54px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }

.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stagebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-right: auto; }
.chip { padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 11px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#plan { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px; touch-action: none; }
#plan svg { display: block; width: 100%; height: auto; max-height: 68vh; }
#plan .item { cursor: grab; }
#plan text { font-family: var(--mono); fill: var(--plan-ink); }
.issues { display: flex; flex-direction: column; gap: 6px; list-style: none; margin: 0; padding: 0; }
.issues li { padding: 8px 12px; border-radius: 8px; font-size: 13px; display: flex; gap: 8px; }
.issues li::before { font-family: var(--mono); font-weight: 500; flex: none; }
.issues .bad { background: var(--bad-bg); color: var(--bad); } .issues .bad::before { content: "FIX"; }
.issues .warn { background: var(--warn-bg); color: var(--warn); } .issues .warn::before { content: "CHECK"; }
.issues .ok { background: var(--ok-bg); color: var(--ok); } .issues .ok::before { content: "OK"; }

.shop { display: flex; flex-direction: column; }
.item-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.item-row.own { opacity: 0.55; }
.item-row .name { font-weight: 600; }
.item-row .price { font-family: var(--mono); text-align: right; white-space: nowrap; }
.links { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.links a { color: var(--accent); text-underline-offset: 3px; }
.sum { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.sum div { display: flex; flex-direction: column; } .sum b { font-family: var(--mono); font-size: 17px; font-weight: 500; }
.finds { grid-column: 1 / -1; list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.finds li { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.finds a { color: var(--accent); font-weight: 500; text-underline-offset: 3px; }
.renders { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.renders img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
.err { color: var(--bad); }
.btn:disabled { opacity: 0.6; cursor: default; }
ul.tips { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; max-width: 65ch; }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; order: -1; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .swatch { transition: border-color 0.12s; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><h1>Roomfit</h1><span>furniture that fits, to the centimetre</span></div>
    <div class="rooms">
      <label for="roomsel" class="small" style="flex-direction:row;align-items:center;gap:8px">Room
        <select id="roomsel" style="width:auto"></select></label>
      <button class="btn" id="addroom" type="button">Add room</button>
    </div>
  </header>
  <nav class="steps" id="steps" role="tablist" aria-label="Steps"></nav>
  <div class="wrap" id="wrap">
    <section class="panel" id="panel"></section>
    <section class="stage">
      <div class="stagebar">
        <div class="chips" id="chips"></div>
        <div class="seg" id="viewseg">
          <button type="button" data-view="plan">Plan</button><button type="button" data-view="iso">3D</button>
        </div>
      </div>
      <div id="plan"></div>
      <ul class="issues" id="issues"></ul>
      <div class="group" id="renderbox"></div>
    </section>
  </div>
</div>

<script>
"use strict";
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r5 = v => Math.round(v / 5) * 5;
const uid = () => "i" + Math.random().toString(36).slice(2, 9);
const aed = v => "AED " + Math.round(v).toLocaleString("en-US");

const PAL = {
  sand:  { name: "Sand & oak",     color: "beige",      wall: "#f2eee6", floor: "#d8c3a0", uph: "#c9b79c", wood: "#b08a5b", accent: "#7a8f7a", rug: "#ece5d6" },
  olive: { name: "Olive & linen",  color: "olive green", wall: "#efeee6", floor: "#c9b595", uph: "#8a8f6a", wood: "#9a7449", accent: "#c9a24b", rug: "#e0dbc8" },
  ink:   { name: "Ink & walnut",   color: "navy blue",  wall: "#e9ecef", floor: "#b79a7c", uph: "#3e4c5e", wood: "#6e4b33", accent: "#c28f5c", rug: "#cfd5db" },
  blush: { name: "Grey & blush",   color: "grey",       wall: "#f1efee", floor: "#cfc6bc", uph: "#a9a7a6", wood: "#c8ae8e", accent: "#c98f86", rug: "#e9e1dd" },
};
const STYLES = { warm: "Warm modern", scandi: "Scandinavian", japandi: "Japandi", classic: "Contemporary classic", mid: "Mid-century" };
// n: name, h: height cm, wt: budget weight, pr: buy order, major: needs walkways, rigid: must pass doors assembled, q: search words
const T = {
  sofa:       { n: "Sofa", h: 85, wt: 22, pr: 1, major: 1, rigid: 1, q: "sofa" },
  chaise:     { n: "Chaise", h: 45, wt: 0, pr: 1 },
  armchair:   { n: "Armchair", h: 80, wt: 7, pr: 2, major: 1, rigid: 1, q: "armchair" },
  tv:         { n: "TV unit", h: 50, wt: 6, pr: 2, major: 1, rigid: 1, q: "tv unit" },
  coffee:     { n: "Coffee table", h: 42, wt: 4, pr: 2, rigid: 1, q: "coffee table" },
  side:       { n: "Side table", h: 55, wt: 1.5, pr: 3, q: "side table" },
  lamp:       { n: "Floor lamp", h: 160, wt: 2, pr: 3, q: "floor lamp" },
  rug:        { n: "Rug", h: 1, wt: 6, pr: 3, q: "rug" },
  table:      { n: "Dining table", h: 75, wt: 12, pr: 1, major: 1, q: "dining table" },
  chair:      { n: "Dining chair", h: 85, wt: 2, pr: 1, q: "dining chair" },
  bench:      { n: "Dining bench", h: 45, wt: 3, pr: 1, q: "dining bench" },
  sideboard:  { n: "Sideboard", h: 80, wt: 8, pr: 2, major: 1, rigid: 1, q: "sideboard" },
  desk:       { n: "Desk", h: 75, wt: 5, pr: 2, major: 1, q: "desk" },
  bookcase:   { n: "Bookcase", h: 190, wt: 5, pr: 2, major: 1, tall: 1, q: "bookcase" },
  bed:        { n: "Bed", h: 50, wt: 22, pr: 1, major: 1, q: "bed frame" },
  nightstand: { n: "Bedside table", h: 55, wt: 3, pr: 2, q: "bedside table" },
  wardrobe:   { n: "Wardrobe", h: 210, wt: 15, pr: 1, major: 1, tall: 1, q: "wardrobe" },
  dresser:    { n: "Chest of drawers", h: 85, wt: 8, pr: 2, major: 1, rigid: 1, q: "chest of drawers" },
  plant:      { n: "Plant", h: 120, wt: 1, pr: 3, q: "indoor plant pot" },
};
const WALLS = ["top", "right", "bottom", "left"];
const STORES = [
  ["IKEA", q => "https://www.ikea.com/ae/en/search/?q=" + q],
  ["Home Centre", q => "https://www.homecentre.com/ae/en/search?q=" + q],
  ["Noon", q => "https://www.noon.com/uae-en/search/?q=" + q],
  ["Amazon.ae", q => "https://www.amazon.ae/s?k=" + q],
  ["Pan Home", q => "https://www.google.com/search?q=site%3Apanhome.com+" + q],
  ["Danube Home", q => "https://www.google.com/search?q=site%3Adanubehome.com+" + q],
  ["Used on Dubizzle", q => "https://www.google.com/search?q=site%3Adubizzle.com+" + q],
];

/* ---------- state ---------- */
function newRoom(type, name) {
  const living = type === "living";
  return { id: uid(), name, type, w: living ? 620 : 420, d: living ? 400 : 360, h: 270,
    openings: living
      ? [{ kind: "door", wall: "W", pos: 30, width: 90 }, { kind: "window", wall: "N", pos: 380, width: 180 }, { kind: "balcony", wall: "E", pos: 110, width: 180 }]
      : [{ kind: "door", wall: "S", pos: 20, width: 85 }, { kind: "window", wall: "N", pos: 120, width: 160 }],
    brief: { seats: 4, dining: 4, tv: true, desk: false, storage: true, bed: "queen", builtin: true, budget: living ? 18000 : 9000 },
    opt: 0, items: [] };
}
let S = { cur: 0, step: "room", view: "plan", example: true,
  shared: { style: "warm", palette: "sand", kids: false, pets: false, rental: true,
    wasBig: false, wasUncomfy: false, wasQuality: false, wasStorage: false, wasColor: false, h1: "", h2: "", doorW: "", liftD: "", liftH: "" },
  rooms: [newRoom("living", "Living / dining")] };
try { const saved = JSON.parse(localStorage.getItem("roomfit1")); if (saved && saved.rooms && saved.rooms.length) S = saved; } catch (e) {}
const media = {};            // per-room images: {underlay, opacity, photos[{name,url}], renders[{name,url}]}
let sel = null, opts = [];
let API = false, hasKey = false, proposal = null, paintBase = "", saveT;   // API: running inside the brain, so Claude and Gemini are available
const busy = {}, err = {};
const R = () => S.rooms[S.cur];
const MR = id => (media[id] = media[id] || { underlay: null, opacity: 0.5, photos: [], renders: [] });
const M = () => MR(R().id);
const fileUrl = (room, name) => `/api/roomfit/file/${room}/${name}`;
async function api(path, body) {
  const r = await fetch("/api/roomfit/" + path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Brain": "1" }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
async function job(kind, body) {
  const { id } = await api(kind, body);
  for (;;) { await new Promise(r => setTimeout(r, 2500)); const j = await api("job?id=" + id);
    if (j.status === "done") return j.result; if (j.status === "error") throw new Error(j.error); }
}
async function run(kind, fn) { busy[kind] = true; err[kind] = ""; renderAll(); try { await fn(); } catch (e) { err[kind] = e.message; } busy[kind] = false; renderAll(); }
function save() {
  try { localStorage.setItem("roomfit1", JSON.stringify(S)); } catch (e) {}
  if (API) { clearTimeout(saveT); saveT = setTimeout(() => api("state", { state: S }).catch(() => {}), 600); }
}
async function loadMedia() {
  for (const r of S.rooms) { const m = MR(r.id), { files } = await api("uploads?room=" + r.id);
    const of = k => files.filter(f => f.startsWith(k + "-")).map(name => ({ name, url: fileUrl(r.id, name) }));
    m.photos = of("photo"); m.renders = of("render"); const pl = of("plan").pop(); m.underlay = pl ? pl.url : null; }
}
const shrink = file => new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
  img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", 0.85)); };
  img.onerror = () => rej(new Error("Could not read that image.")); img.src = u; });

/* ---------- geometry ---------- */
const fp = it => ({ x: it.x, y: it.y, w: it.rot % 2 ? it.bd : it.bw, d: it.rot % 2 ? it.bw : it.bd });
const mk = (type, bw, bd, rot, x, y, extra) => Object.assign({ id: uid(), type, bw: r5(bw), bd: r5(bd), rot, x: Math.round(x), y: Math.round(y) }, extra);
function gap(a, b) {
  const dx = Math.max(0, a.x - (b.x + b.w), b.x - (a.x + a.w)), dy = Math.max(0, a.y - (b.y + b.d), b.y - (a.y + a.d));
  return { dx, dy, straight: dx > 0 && dy > 0 ? Infinity : Math.max(dx, dy), any: Math.hypot(dx, dy) };
}
const hit = (a, b, m = 2) => Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) > m && Math.min(a.y + a.d, b.y + b.d) - Math.max(a.y, b.y) > m;
function zones(room) {
  return room.openings.filter(o => o.kind !== "open").map(o => {
    const depth = o.kind === "door" ? o.width : o.kind === "balcony" ? 80 : 25;
    const z = o.wall === "N" ? { x: o.pos, y: 0, w: o.width, d: depth } : o.wall === "S" ? { x: o.pos, y: room.d - depth, w: o.width, d: depth }
      : o.wall === "W" ? { x: 0, y: o.pos, w: depth, d: o.width } : { x: room.w - depth, y: o.pos, w: depth, d: o.width };
    return Object.assign(z, { kind: o.kind });
  });
}

/* ---------- layout generators (in a frame where L is the long side) ---------- */
function genLiving(L, Sd, b) {
  const out = [], k = b.compact ? 0.9 : 1, n = b.dining;
  const [tl, tw] = { 0: [0, 0], 2: [80, 80], 4: [120, 80], 6: [180, 90], 8: [220, 100] }[n] || [120, 80];
  const vert = n && Sd >= tl + 150, sb = n && b.storage ? 45 : 0;
  const Dz = n ? Math.min((vert ? tw + 212 : tl + 170) + sb, L * 0.5) : 0, Lz = L - Dz;
  const onSofa = b.sect ? Math.min(b.seats, 5) : Math.min(b.seats, 3);
  let sw = b.sect ? 270 : onSofa <= 2 ? 160 : 215;
  sw = clamp(r5(sw * k), 140, Math.max(140, Lz - (b.desk ? 170 : 100)));
  const sd = r5(95 * k), sx = r5(clamp((Lz - sw) / 2 + (b.desk ? 40 : 0), 0, Math.max(0, Lz - sw)));
  const sofa = mk("sofa", sw, sd, 2, sx, Sd - sd, { sect: !!b.sect });
  const cx = b.sect ? sx + 95 + (sw - 95) / 2 : sx + sw / 2;
  out.push(mk("rug", Math.min(sw + 40, Lz - 10), 170, 0, Math.max(5, sx - 20), Math.max(50, Sd - sd - 140)));
  out.push(sofa);
  if (b.sect) out.push(mk("chaise", 95, 70, 2, sx, Sd - sd - 70, { parent: sofa.id }));
  if (b.tv) out.push(mk("tv", Math.min(180, Math.max(120, sw)), 42, 0, clamp(cx - 90, 0, L - 180), 0));
  else if (b.storage) out.push(mk("bookcase", 160, 35, 0, clamp(cx - 80, 0, L - 160), 0));
  if (Sd - sd - 100 - (b.tv ? 42 : 0) >= 70) out.push(mk("coffee", r5(110 * k), 60, 0, cx - r5(110 * k) / 2, Sd - sd - 100));
  let extra = clamp(b.seats - onSofa, 0, 2);

  for (const it of r.items) { if (it.type === "chaise" || it.desk) continue;
    const key = [it.type, it.bw, it.bd, !!it.own, !!it.sect].join("|");
    if (!rows.has(key)) rows.set(key, { it, ids: [], n: 0, key }); const g = rows.get(key); g.n++; g.ids.push(it.id); }
  const list = [...rows.values()].map(g => { const it = g.it, t = T[it.type]; let name = t.n, q = t.q, wt = t.wt;
    if (it.type === "sofa") { const seats = it.bw < 175 ? 2 : it.bw < 240 ? 3 : 4; name = it.sect ? "Corner sofa (L-shaped)" : seats + "-seater sofa"; q = (it.sect ? "corner sofa l shaped " : seats + " seater sofa ") + p.color; if (it.sect) wt = 28; }
    if (it.type === "armchair" || it.type === "chair") q += " " + p.color;
    if (it.type === "table") { name = `Dining table for ${it.seats || 4}`; q = `${it.seats || 4} seater dining table`; }
    if (it.type === "bed") { const sz = { single: "90 × 200", queen: "160 × 200", king: "180 × 200" }[it.size] || "160 × 200"; name = `Bed frame, ${sz} mattress`; q = "bed frame " + sz.replace(/ /g, ""); }
    if (it.type === "rug") q = `rug ${Math.round(Math.min(it.bw, it.bd) / 10) * 10}x${Math.round(Math.max(it.bw, it.bd) / 10) * 10}`;
    return Object.assign(g, { name, q, wt: wt * g.n, pr: t.pr, size: it.type === "bed" ? "" : `up to ${it.bw} × ${it.bd} cm` + (it.sect ? ", chaise 165 cm deep" : "") }); });
  const bed = r.items.find(i => i.type === "bed");
  if (bed && !bed.own) { const sz = { single: "90x200", queen: "160x200", king: "180x200" }[bed.size] || "160x200"; list.push({ it: { type: "mattress" }, key: "mattress", ids: [], n: 1, name: "Mattress " + sz.replace("x", " × "), q: "mattress " + sz, wt: 18, pr: 1, size: "try in a showroom before buying" }); }
  const budget = +r.brief.budget || 0, reserve = budget * 0.1, tot = list.filter(g => !g.it.own).reduce((a, g) => a + g.wt, 0) || 1;
  for (const g of list) g.price = g.it.own ? 0 : Math.round((budget - reserve) * g.wt / tot / 50) * 50;
  list.sort((a, b) => a.pr - b.pr || b.wt - a.wt);
  return { list, budget, reserve };
}
function tips() {
  const s = S.shared, r = R(), out = [];
  for (const o of r.openings) if (o.kind === "window" || o.kind === "balcony") out.push(`Curtains for the ${o.width} cm ${o.kind === "balcony" ? "balcony door" : "window"}: a rod of about ${o.width + 40} cm and two panels of ${o.width} cm each, ${r.h - 5} cm long so they hang from the ceiling line.`);
  const hs = [+s.h1, +s.h2].filter(Boolean);
  if (hs.length) { const lo = Math.min(...hs), hi = Math.max(...hs);
    out.push(hi - lo >= 15 ? `You are ${lo} and ${hi} cm tall. Look for a sofa seat depth of 55 to 58 cm with loose back cushions, so the shorter person can sit upright and the taller one can lounge.`
      : hi >= 180 ? "At your height, look for a sofa seat depth of 58 to 65 cm." : lo <= 165 ? "At your height, look for a sofa seat depth of 50 to 55 cm so your feet reach the floor." : "A sofa seat depth of 54 to 60 cm suits your height."); }
  if (s.wasUncomfy) out.push("Last time comfort was the problem. Sit on sofas and chairs in a showroom for ten minutes before ordering, and check the return policy for anything bought online.");
  if (s.wasQuality) out.push("For pieces used every day (sofa, mattress, dining chairs), check the frame material and warranty length before the price.");
  if (s.wasColor) out.push("Order fabric swatches and look at them in your room at midday and at night. Strong daylight washes colours out.");
  if (s.kids || s.pets) out.push("With " + [s.kids && "children", s.pets && "pets"].filter(Boolean).join(" and ") + ", choose removable washable covers or tightly woven performance fabric, and rounded table corners.");
  if (s.rental) out.push("Renting: prefer floor and table lamps, leaning mirrors and freestanding shelves over anything that needs drilling.");
  out.push("Before ordering a large piece, mark its footprint on the floor with masking tape and live with it for a day.");
  return out;
}

function setStep(k) { S.step = k; sel = null; renderAll(); window.scrollTo({ top: 0 }); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-step],[data-act],[data-pal],[data-opt],[data-view]"); if (!t) return;
  const r = R();
  if (t.dataset.step) return setStep(t.dataset.step);
  if (t.dataset.pal) { S.shared.palette = t.dataset.pal; return renderAll(); }
  if (t.dataset.view) { S.view = t.dataset.view; return renderAll(); }
  if (t.dataset.opt) { r.opt = +t.dataset.opt; r.items = JSON.parse(JSON.stringify(opts[r.opt].items)); sel = null; return renderAll(); }
  const act = t.dataset.act, it = r.items.find(i => i.id === sel);
  if (act === "read") return run("read", async () => { proposal = Object.assign(await job("read", { room: r.id }), { room: r.id }); });
  if (act === "applyread" && proposal) { Object.assign(r, { w: proposal.w, d: proposal.d, h: proposal.h, openings: proposal.openings }); proposal = null; S.example = false; rebuild(); }
  if (act === "dismissread") proposal = null;
  if (act === "clearuploads") { const m = M(); m.photos = []; m.underlay = null; paintBase = ""; api("clear", { room: r.id }).catch(() => {}); }
  if (act === "savekey") return run("paint", async () => { await api("key", { key: $("#gkey").value }); hasKey = true; });
  if (act === "paint") { const m = M(), photo = m.photos.some(p => p.name === paintBase) ? paintBase : "";
    return run("paint", async () => { const res = await job("render", { room: r.id, plan: await planPng(), brief: paintBrief(), photo }); m.renders.push({ name: res.name, url: fileUrl(r.id, res.name) }); }); }
  if (act === "find") { const { list } = shopRows(), p = PAL[S.shared.palette];
    const pieces = list.filter(g => !g.it.own).map(g => ({ key: g.key, what: g.name + (g.n > 1 ? " x" + g.n : ""), w: g.it.bw || 0, d: g.it.bd || 0, budget: Math.round(g.price / g.n) }));
    return run("find", async () => { r.finds = await job("find", { pieces, style: STYLES[S.shared.style], colours: p.name + ", " + p.color }); }); }
  if (act === "addopening") { r.openings.push({ kind: "window", wall: "N", pos: 50, width: 120 }); S.example = false; rebuild(); }
  if (act === "delopening") { r.openings.splice(+t.dataset.i, 1); S.example = false; rebuild(); }
  if (act === "reset") rebuild();
  if (act === "add") { const type = $("#addtype").value, dims = { sofa: [215, 95], armchair: [80, 85], tv: [180, 42], coffee: [110, 60], side: [45, 45], lamp: [35, 35], rug: [240, 170], table: [120, 80], chair: [45, 48], bench: [120, 40], sideboard: [160, 45], desk: [120, 60], bookcase: [80, 35], bed: [165, 205], nightstand: [50, 40], wardrobe: [200, 60], dresser: [120, 50], plant: [40, 40] }[type];
    const n = mk(type, dims[0], dims[1], 0, r5(r.w / 2 - dims[0] / 2), r5(r.d / 2 - dims[1] / 2)); r.items.push(n); sel = n.id; }
  if (it && act === "remove") { r.items = r.items.filter(i => i.id !== it.id && i.parent !== it.id); sel = null; }
  if (it && act === "rotate") { const f = fp(it), cx = f.x + f.w / 2, cy = f.y + f.d / 2;
    for (const m of r.items.filter(i => i.id === it.id || i.parent === it.id)) { const g = fp(m), dx = g.x + g.w / 2 - cx, dy = g.y + g.d / 2 - cy;
      m.rot = (m.rot + 1) % 4; const h = fp(m); m.x = Math.round(cx - dy - h.w / 2); m.y = Math.round(cy + dx - h.d / 2); } }
  if (act === "copy") { const { list } = shopRows(), txt = `${r.name} (${r.w} × ${r.d} cm)\n` + list.map(g => `- ${g.name}${g.n > 1 ? " × " + g.n : ""}${g.size ? ", " + g.size : ""}: ${g.it.own ? "already owned" : "up to " + aed(g.price)}`).join("\n");
    const done = () => { const c = $("#copied"); if (c) c.hidden = false; };
    return navigator.clipboard ? navigator.clipboard.writeText(txt).then(done, () => {}) : undefined; }
  renderAll();
});
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset.k, r = R();
  if (el.dataset.up === "opacity") { M().opacity = +el.value; return renderStage(); }
  if (!k) return;
  const val = el.type === "checkbox" ? el.checked : el.type === "number" || el.hasAttribute("data-num") ? (el.value === "" ? "" : +el.value) : el.value;
  const [scope, ...rest] = k.split(".");
  if (scope === "i") { const it = r.items.find(i => i.id === sel); if (!it) return;
    if (rest[0] === "own") it.own = val; else if (val >= 20) it[rest[0]] = val; renderStage(); return save(); }
  if (scope === "o") { r.openings[+rest[0]][rest[1]] = val; }
  else { const obj = scope === "r" ? r : scope === "b" ? r.brief : S.shared; obj[rest[0]] = val; }
  if (scope === "r" || scope === "o") S.example = false;
  if ((scope === "r" && rest[0] !== "name") || scope === "o") { if (!(r.w >= 150 && r.d >= 150)) return; }
  const structural = k === "r.type" || (scope === "o" && rest[1] === "wall");
  if (!(scope === "r" && rest[0] === "name") && !["s.style", "s.h1", "s.h2", "s.kids", "s.pets", "s.rental", "s.wasUncomfy", "s.wasColor", "s.wasQuality", "s.doorW", "s.liftD", "s.liftH", "b.budget"].includes(k)) rebuild();
  if (structural) renderAll(); else { renderChrome(); renderStage(); save(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "roomsel") { S.cur = +el.value; buildOptions(); sel = null; return renderAll(); }
  if (el.id === "renderbase") paintBase = el.value;
  if (el.dataset.up === "plan" || el.dataset.up === "photos") { const m = M(), r = R(), kind = el.dataset.up === "plan" ? "plan" : "photo";
    for (const f of el.files) shrink(f).then(async data => { let item = { name: "", url: data };
      if (API) { const { name } = await api("upload", { room: r.id, kind, data }); item = { name, url: fileUrl(r.id, name) }; }
      if (kind === "plan") m.underlay = item.url; else m.photos.push(item);
    }).catch(e => { err.read = e.message; }).finally(() => { renderPanel(); renderStage(); }); }
});
$("#addroom").addEventListener("click", () => { const n = S.rooms.filter(r => r.type === "bedroom").length;
  S.rooms.push(newRoom("bedroom", n ? "Bedroom " + (n + 1) : "Bedroom")); S.cur = S.rooms.length - 1; S.step = "room"; rebuild(); renderAll(); });

/* drag on the plan */
let drag = null;
const plan = $("#plan");
const toCm = e => { const svg = $("svg", plan); return new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); };
plan.addEventListener("pointerdown", e => {
  if (S.view !== "plan") return;
  const g = e.target.closest(".item"), r = R();
  if (!g) { if (sel) { sel = null; renderStage(); if (S.step === "layout") renderPanel(); } return; }
  const it = r.items.find(i => i.id === g.dataset.id), p = toCm(e);
  const group = r.items.filter(i => i.id === it.id || i.parent === it.id).map(m => ({ m, x: m.x, y: m.y }));
  drag = { it, p, group, moved: false }; sel = it.id; plan.setPointerCapture(e.pointerId); e.preventDefault();
});
plan.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = toCm(e), r = R(), f0 = fp(drag.it), o = drag.group[0];
  const dx = clamp(r5(o.x + p.x - drag.p.x), 0, Math.max(0, r.w - f0.w)) - o.x, dy = clamp(r5(o.y + p.y - drag.p.y), 0, Math.max(0, r.d - f0.d)) - o.y;
  if (dx || dy) drag.moved = true;
  for (const g of drag.group) { g.m.x = g.x + dx; g.m.y = g.y + dy; const f = fp(g.m), el = plan.querySelector(`[data-id="${g.m.id}"]`);
    if (el) el.setAttribute("transform", `translate(${f.x + f.w / 2} ${f.y + f.d / 2}) rotate(${g.m.rot * 90}) translate(${-g.m.bw / 2} ${-g.m.bd / 2})`); }
});
const endDrag = () => { if (!drag) return; drag = null; if (S.step !== "layout" && S.step !== "shop") S.step = "layout"; renderAll(); };
plan.addEventListener("pointerup", endDrag); plan.addEventListener("pointercancel", endDrag);

/* boot */
async function boot() {
  const seed = window.ROOMFIT_SEED;   // a prepared set of rooms; replaces older saved work once
  if (seed && S.seed !== seed.seed) S = JSON.parse(JSON.stringify(seed));
  try { const { state, gemini } = await api("state"); API = true; hasKey = !!gemini; if (state && state.rooms && state.rooms.length) S = state; } catch (e) {}
  for (const r of S.rooms) r.id = r.id || uid();
  S.cur = clamp(S.cur | 0, 0, S.rooms.length - 1);
  if (API) try { await loadMedia(); } catch (e) {}
  buildOptions();
  if (!R().items.length) rebuild();
  renderAll();
}
boot();
</script>
